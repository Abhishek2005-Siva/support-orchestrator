# Render blueprint: New -> Blueprint -> pick the repo. Serves API + UI (/app/) from one Docker web service.
services:
  - type: web
    name: orbit-support
    runtime: docker
    plan: free              # free instances sleep when idle and have an ephemeral disk (SQLite is re-seeded on each start: fine for a demo)
    healthCheckPath: /healthz
    envVars:
      - key: NVIDIA_API_KEY
        sync: false          # set in the Render dashboard; never commit it
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_MODE
        value: live
      - key: DEMO_MODE       # shows one-click synthetic demo logins on the login page. Turn off for anything non-demo.
        value: "true"
      - key: WEB_CONCURRENCY # keep 1: rate limiter / answer cache are per process
        value: "1"
