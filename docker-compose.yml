# docker compose up --build         (SQLite, mock-free, uses your NVIDIA key from .env)
# docker compose --profile postgres up --build   (Postgres + Redis available; set DATABASE_URL below)
services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////srv/data/support.db}
      CHECKPOINT_DB: /srv/data/checkpoints.db
      LOG_DIR: /srv/logs
    ports: ["8000:8000"]
    volumes: ["appdata:/srv/data", "applogs:/srv/logs"]
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: postgres:16
    environment: { POSTGRES_USER: orbit, POSTGRES_PASSWORD: orbit, POSTGRES_DB: orbit }
    volumes: ["pgdata:/var/lib/postgresql/data"]
    # then: DATABASE_URL=postgresql+asyncpg://orbit:orbit@postgres:5432/orbit

  redis:
    profiles: ["postgres"]
    image: redis:7
    # reserved for multi-worker rate limiting / cache (interfaces: app/core/ratelimit.py, app/graph/cache.py)

  # Optional self-hosted Langfuse: see https://langfuse.com/self-hosting (docker-compose); then set LANGFUSE_* in .env.

volumes: { appdata: {}, applogs: {}, pgdata: {} }
